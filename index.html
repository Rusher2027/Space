<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allie's Book Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
    }

    /* Variables de color futurista por canción */
    :root {
      --theme-bg: #030305;
      --accent-color: #f472b6;
      --accent-glow: rgba(244, 114, 182, 0.4);
    }

    body.theme-0 {
      --theme-bg: linear-gradient(135deg, #1e0b17, #2c0b25, #0d030b);
      --accent-color: #f472b6;
      --accent-glow: rgba(244, 114, 182, 0.5);
    }
    body.theme-1 {
      --theme-bg: linear-gradient(135deg, #061527, #0c203b, #030a14);
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.5);
    }
    body.theme-2 {
      --theme-bg: linear-gradient(135deg, #231203, #331509, #0f0701);
      --accent-color: #fbbf24;
      --accent-glow: rgba(251, 191, 36, 0.5);
    }

    body {
      background-color: #030305;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      overflow-x: hidden;
      position: relative;
      transition: background 1.5s ease;
    }

    /* OVERLAY DEL GIF INTRO (Sólo la 1ra vez) */
    .intro-gif-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      background-image: url('https://i.postimg.cc/Nfq1QBLP/f87ea7ba7524072a16622a83b588f48e-(1).gif');
      background-size: cover;
      background-position: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .intro-gif-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Ocultar la interfaz durante la intro */
    .open-book.hide-for-intro {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    /* CUANDO REPRODUCE: El fondo general de la página cambia a colores futuristas animados */
    body.playing {
      background: var(--theme-bg);
      background-size: 400% 400%;
      animation: gradientShift 10s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* CONTENEDOR DEL LIBRO */
    .open-book {
      background: rgba(16, 16, 22, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      width: 100%;
      max-width: 980px;
      min-height: 540px;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.9);
      display: flex;
      position: relative;
      overflow: hidden;
      transition: all 1s ease;
    }

    body.playing .open-book {
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 50px var(--accent-glow), 0 40px 80px rgba(0, 0, 0, 0.9);
      animation: bookAura 3s ease-in-out infinite;
    }

    @keyframes bookAura {
      0%, 100% { box-shadow: 0 0 40px var(--accent-glow), 0 40px 80px rgba(0, 0, 0, 0.9); }
      50% { box-shadow: 0 0 70px var(--accent-glow), 0 40px 80px rgba(0, 0, 0, 0.9); }
    }

    /* Lomo Central */
    .book-binding {
      width: 26px;
      background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(255,255,255,0.04) 50%, rgba(0,0,0,0.8) 100%);
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
    }

    /* PÁGINAS DEL LIBRO */
    .book-page {
      flex: 1;
      padding: 45px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: transparent;
      color: #f1f5f9;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .book-page.page-flip-effect {
      transform: rotateY(-15deg) scale(0.98);
      opacity: 0.3;
    }

    .book-page:first-child {
      border-right: 1px solid rgba(255, 255, 255, 0.06);
    }

    .page-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .chapter-tag {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 700;
    }

    .nav-arrow-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .nav-arrow-btn:hover {
      background: var(--accent-color);
      color: #030305;
      border-color: var(--accent-color);
      transform: translateX(3px);
    }

    /* PÁGINA IZQUIERDA: PERFIL */
    .page-title {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .cyber-info-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cyber-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cyber-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #64748b;
    }

    .cyber-value {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
    }

    /* PÁGINA DERECHA: REPRODUCTOR FUTURISTA */
    .futuristic-player {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
      transition: all 0.5s ease;
    }

    body.playing .futuristic-player {
      border-color: var(--accent-color);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .song-cover {
      width: 55px;
      height: 55px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: border-color 0.5s ease;
    }

    body.playing .song-cover {
      border-color: var(--accent-color);
    }

    .eq-bar-container {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 12px;
      margin-top: 4px;
    }

    .eq-bar {
      width: 3px;
      background: #64748b;
      border-radius: 2px;
      height: 3px;
    }

    body.playing .eq-bar { background: var(--accent-color); }
    body.playing .eq-bar:nth-child(1) { animation: eqAnim 0.8s ease-in-out infinite alternate; }
    body.playing .eq-bar:nth-child(2) { animation: eqAnim 1.1s ease-in-out infinite alternate 0.2s; }
    body.playing .eq-bar:nth-child(3) { animation: eqAnim 0.7s ease-in-out infinite alternate 0.4s; }
    body.playing .eq-bar:nth-child(4) { animation: eqAnim 0.9s ease-in-out infinite alternate 0.1s; }

    @keyframes eqAnim {
      0% { height: 3px; }
      100% { height: 12px; }
    }

    .song-title-main {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .song-artist-main {
      font-size: 11px;
      color: #94a3b8;
    }

    .player-controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-bottom: 10px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 16px;
      transition: color 0.2s, transform 0.2s;
    }

    .ctrl-btn:hover {
      color: var(--accent-color);
      transform: scale(1.15);
    }

    .main-play-btn {
      background: #ffffff;
      color: #030305;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    body.playing .main-play-btn {
      background: var(--accent-color);
      color: #030305;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .main-play-btn:hover { transform: scale(1.08); }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      color: #64748b;
      margin-bottom: 10px;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-filled {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
      transition: background 0.5s ease;
    }

    body.playing .progress-filled { background: var(--accent-color); }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: #64748b;
    }

    .volume-slider {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      accent-color: #ffffff;
      cursor: pointer;
    }

    body.playing .volume-slider { accent-color: var(--accent-color); }

    /* PLAYLIST */
    .tracks-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 125px;
      overflow-y: auto;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .track-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .track-item.active {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    body.playing .track-item.active {
      border-color: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .track-thumb {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      object-fit: cover;
    }

    .track-info { flex: 1; }

    .track-name {
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
    }

    .track-artist {
      font-size: 9px;
      color: #94a3b8;
    }

    @media (max-width: 768px) {
      .open-book {
        flex-direction: column;
        max-width: 450px;
      }
      .book-binding { display: none; }
      .book-page { padding: 25px; }
    }
  </style>
</head>
<body class="theme-0">

  <!-- OVERLAY GIF DE INTRO DURO PANTALLA COMPLETA -->
  <div class="intro-gif-overlay" id="intro-overlay"></div>

  <div class="open-book" id="open-book-main">
    <div class="book-binding"></div>

    <!-- PÁGINA IZQUIERDA -->
    <div class="book-page" id="left-page">
      <div>
        <div class="page-nav-bar">
          <div class="chapter-tag" id="left-chapter-tag">CAPÍTULO I — IDENTIDAD</div>
        </div>

        <div id="left-content">
          <div class="page-title">ALLIE</div>

          <div class="cyber-info-grid">
            <div class="cyber-card">
              <span class="cyber-label">Name</span>
              <span class="cyber-value">Allie</span>
            </div>
            <div class="cyber-card">
              <span class="cyber-label">País</span>
              <span class="cyber-value">Perú</span>
            </div>
            <div class="cyber-card">
              <span class="cyber-label">Username</span>
              <span class="cyber-value">Addictedtoyouu</span>
            </div>
          </div>
        </div>
      </div>

      <div style="font-size: 11px; color: #64748b; letter-spacing: 1px;">
        ALLIE'S SPACE — 2026
      </div>
    </div>

    <!-- PÁGINA DERECHA -->
    <div class="book-page" id="right-page">
      <div>
        <div class="page-nav-bar">
          <div class="chapter-tag" id="right-chapter-tag">CAPÍTULO II — SONIDOS</div>
          <button class="nav-arrow-btn" onclick="flipPageNext()">Siguiente Página ➔</button>
        </div>

        <div id="right-content">
          <!-- REPRODUCTOR -->
          <div class="futuristic-player">
            <div class="player-top">
              <img id="active-cover" src="https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg" class="song-cover" alt="Cover">
              <div style="flex: 1;">
                <div class="song-title-main" id="active-title">SUPERESTRELLA</div>
                <div class="song-artist-main" id="active-artist">Aitana</div>
                <div class="eq-bar-container">
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                </div>
              </div>
            </div>

            <div class="player-controls-row">
              <button class="ctrl-btn" onclick="prevSong()" title="Anterior">⏮</button>
              <button class="main-play-btn" id="play-btn" onclick="togglePlay()">▶</button>
              <button class="ctrl-btn" onclick="nextSong()" title="Siguiente">⏭</button>
            </div>

            <div class="progress-container">
              <span id="current-time">0:00</span>
              <div class="progress-bar" id="progress-bar" onclick="setProgress(event)">
                <div class="progress-filled" id="progress-filled"></div>
              </div>
              <span id="total-duration">0:00</span>
            </div>

            <div class="volume-container">
              <span>🔊</span>
              <input type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" id="volume-slider" oninput="setVolume(this.value)">
            </div>
          </div>

          <div class="chapter-tag" style="margin-bottom: 8px;">PLAYLIST / CANCIONES</div>
          <div class="tracks-list" id="playlist-container">
            <div class="track-item active" onclick="playSong(0)" id="track-0">
              <img src="https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg" class="track-thumb" alt="Superestrella">
              <div class="track-info">
                <div class="track-name">SUPERESTRELLA</div>
                <div class="track-artist">Aitana</div>
              </div>
            </div>

            <div class="track-item" onclick="playSong(1)" id="track-1">
              <img src="https://i.postimg.cc/50wYKF10/artworks-z-GXe-TIC6Z17nhvx-J-1v9QKQ-t500x500.jpg" class="track-thumb" alt="Mon Amour">
              <div class="track-info">
                <div class="track-name">Mon Amour (Remix)</div>
                <div class="track-artist">Zzoilo x Aitana</div>
              </div>
            </div>

            <div class="track-item" onclick="playSong(2)" id="track-2">
              <img src="https://i.postimg.cc/gk8nshzS/250x250-000000-80-0-0-(1).jpg" class="track-thumb" alt="Juno">
              <div class="track-info">
                <div class="track-name">Juno</div>
                <div class="track-artist">Sabrina Carpenter</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player" src="Aitana - SUPERESTRELLA.mp3"></audio>

  <script>
    const playlist = [
      { file: 'Aitana - SUPERESTRELLA.mp3', title: 'SUPERESTRELLA', artist: 'Aitana', cover: 'https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg' },
      { file: 'zzoilo - Mon Amour (Remix).mp3', title: 'Mon Amour (Remix)', artist: 'Zzoilo x Aitana', cover: 'https://i.postimg.cc/50wYKF10/artworks-z-GXe-TIC6Z17nhvx-J-1v9QKQ-t500x500.jpg' },
      { file: 'Sabrina Carpenter - Juno.mp3', title: 'Juno', artist: 'Sabrina Carpenter', cover: 'https://i.postimg.cc/gk8nshzS/250x250-000000-80-0-0-(1).jpg' }
    ];

    let currentIdx = 0;
    let pageState = 1;
    let hasPlayedIntro = false; // Control de la animación inicial de única vez

    const audio = document.getElementById('audio-player');
    const introOverlay = document.getElementById('intro-overlay');
    const openBookMain = document.getElementById('open-book-main');

    function updateTheme(index) {
      document.body.classList.remove('theme-0', 'theme-1', 'theme-2');
      document.body.classList.add(`theme-${index}`);
    }

    function updatePlayerUI() {
      const song = playlist[currentIdx];
      const activeTitle = document.getElementById('active-title');
      const activeArtist = document.getElementById('active-artist');
      const activeCover = document.getElementById('active-cover');
      
      if(activeTitle) activeTitle.textContent = song.title;
      if(activeArtist) activeArtist.textContent = song.artist;
      if(activeCover) activeCover.src = song.cover;

      document.querySelectorAll('.track-item').forEach((item, i) => {
        if (i === currentIdx) item.classList.add('active');
        else item.classList.remove('active');
      });
    }

    function flipPageNext() {
      const leftPage = document.getElementById('left-page');
      const rightPage = document.getElementById('right-page');
      leftPage.classList.add('page-flip-effect');
      rightPage.classList.add('page-flip-effect');

      setTimeout(() => {
        const leftChapterTag = document.getElementById('left-chapter-tag');
        const leftContent = document.getElementById('left-content');
        const rightChapterTag = document.getElementById('right-chapter-tag');
        const rightContent = document.getElementById('right-content');

        if (pageState === 1) {
          pageState = 2;
          leftChapterTag.textContent = 'CAPÍTULO III — COMUNIDAD';
          leftContent.innerHTML = `
            <div class="page-title" style="font-size: 26px;">GALERÍA & REDES</div>
            <div class="cyber-info-grid">
              <div class="cyber-card" style="cursor: pointer;" onclick="alert('Sección de Fotos')">
                <span class="cyber-label">Galería</span>
                <span class="cyber-value">📷 Fotos</span>
              </div>
              <div class="cyber-card" style="cursor: pointer;" onclick="alert('Sección de Amigos')">
                <span class="cyber-label">Comunidad</span>
                <span class="cyber-value">💬 Amigos</span>
              </div>
            </div>
          `;
          
          rightChapterTag.textContent = 'FIN DEL LIBRO';
          rightContent.innerHTML = `
            <div style="text-align: center; padding: 50px 20px;">
              <div class="page-title" style="font-size: 22px; margin-bottom: 15px;">ALLIE'S SPACE</div>
              <p style="font-size: 13px; color: #94a3b8; line-height: 1.6;">Gracias por visitar este rincón interactivo. Diseñado con estilo y música.</p>
            </div>
          `;
        } else {
          pageState = 1;
          leftChapterTag.textContent = 'CAPÍTULO I — IDENTIDAD';
          leftContent.innerHTML = `
            <div class="page-title">ALLIE</div>
            <div class="cyber-info-grid">
              <div class="cyber-card">
                <span class="cyber-label">Name</span>
                <span class="cyber-value">Allie</span>
              </div>
              <div class="cyber-card">
                <span class="cyber-label">País</span>
                <span class="cyber-value">Perú</span>
              </div>
              <div class="cyber-card">
                <span class="cyber-label">Username</span>
                <span class="cyber-value">Addictedtoyouu</span>
              </div>
            </div>
          `;

          rightChapterTag.textContent = 'CAPÍTULO II — SONIDOS';
          rightContent.innerHTML = `
            <div class="futuristic-player">
              <div class="player-top">
                <img id="active-cover" src="${playlist[currentIdx].cover}" class="song-cover" alt="Cover">
                <div style="flex: 1;">
                  <div class="song-title-main" id="active-title">${playlist[currentIdx].title}</div>
                  <div class="song-artist-main" id="active-artist">${playlist[currentIdx].artist}</div>
                  <div class="eq-bar-container">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                  </div>
                </div>
              </div>

              <div class="player-controls-row">
                <button class="ctrl-btn" onclick="prevSong()" title="Anterior">⏮</button>
                <button class="main-play-btn" id="play-btn" onclick="togglePlay()">${audio.paused ? '▶' : '❚❚'}</button>
                <button class="ctrl-btn" onclick="nextSong()" title="Siguiente">⏭</button>
              </div>

              <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar" onclick="setProgress(event)">
                  <div class="progress-filled" id="progress-filled"></div>
                </div>
                <span id="total-duration">0:00</span>
              </div>

              <div class="volume-container">
                <span>🔊</span>
                <input type="range" min="0" max="1" step="0.01" value="${audio.volume}" class="volume-slider" id="volume-slider" oninput="setVolume(this.value)">
              </div>
            </div>

            <div class="chapter-tag" style="margin-bottom: 8px;">PLAYLIST / CANCIONES</div>
            <div class="tracks-list" id="playlist-container">
              ${playlist.map((song, i) => `
                <div class="track-item ${i === currentIdx ? 'active' : ''}" onclick="playSong(${i})" id="track-${i}">
                  <img src="${song.cover}" class="track-thumb" alt="${song.title}">
                  <div class="track-info">
                    <div class="track-name">${song.title}</div>
                    <div class="track-artist">${song.artist}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
          updatePlayerUI();
        }
      }, 250);

      setTimeout(() => {
        leftPage.classList.remove('page-flip-effect');
        rightPage.classList.remove('page-flip-effect');
      }, 500);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function triggerStartSequence() {
      // Activa animación de GIF la primera vez que se reproduce
      if (!hasPlayedIntro) {
        hasPlayedIntro = true;
        introOverlay.classList.add('active');
        openBookMain.classList.add('hide-for-intro');

        // Duración de la animación del GIF (3.5 segundos)
        setTimeout(() => {
          introOverlay.classList.remove('active');
          openBookMain.classList.remove('hide-for-intro');
          document.body.classList.add('playing');
        }, 3500);
      } else {
        document.body.classList.add('playing');
      }
    }

    function playSong(index) {
      currentIdx = index;
      updateTheme(currentIdx);
      const song = playlist[currentIdx];
      audio.src = song.file;
      audio.play();

      triggerStartSequence();

      const pBtn = document.getElementById('play-btn');
      if(pBtn) pBtn.textContent = '❚❚';
      
      updatePlayerUI();
    }

    function togglePlay() {
      if (audio.paused) {
        if (!audio.currentTime) {
          playSong(0);
        } else {
          audio.play();
          triggerStartSequence();
          const pBtn = document.getElementById('play-btn');
          if(pBtn) pBtn.textContent = '❚❚';
        }
      } else {
        audio.pause();
        document.body.classList.remove('playing');
        const pBtn = document.getElementById('play-btn');
        if(pBtn) pBtn.textContent = '▶';
      }
    }

    function nextSong() {
      currentIdx = (currentIdx + 1) % playlist.length;
      playSong(currentIdx);
    }

    function prevSong() {
      currentIdx = (currentIdx - 1 + playlist.length) % playlist.length;
      playSong(currentIdx);
    }

    audio.addEventListener('timeupdate', () => {
      const pFilled = document.getElementById('progress-filled');
      const cTime = document.getElementById('current-time');
      const tDur = document.getElementById('total-duration');
      if (audio.duration && pFilled) {
        const percent = (audio.currentTime / audio.duration) * 100;
        pFilled.style.width = `${percent}%`;
        if(cTime) cTime.textContent = formatTime(audio.currentTime);
        if(tDur) tDur.textContent = formatTime(audio.duration);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      const tDur = document.getElementById('total-duration');
      if(tDur) tDur.textContent = formatTime(audio.duration);
    });

    function setProgress(e) {
      const pBar = document.getElementById('progress-bar');
      if(pBar && audio.duration) {
        const width = pBar.clientWidth;
        audio.currentTime = (e.offsetX / width) * audio.duration;
      }
    }

    function setVolume(val) {
      audio.volume = val;
    }

    audio.addEventListener('ended', () => {
      nextSong();
    });
  </script>

</body>
</html>
