<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allie's Book Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
    }

    body {
      background-color: #050507;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      overflow-x: hidden;
      transition: background 1s ease;
    }

    /* ESTADO DE REPRODUCCIÓN: Fondo rosa y efectos sutiles */
    body.playing {
      background-color: #12080f;
    }

    body.playing .ambient-glow {
      opacity: 1;
      transform: scale(1.1);
    }

    /* Fondo ambiental con efecto lumínico rosa */
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(244, 114, 182, 0.12) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 1s ease, transform 1s ease;
      z-index: 0;
      pointer-events: none;
    }

    /* Contenedor Principal: El Libro Abierto */
    .open-book {
      background: linear-gradient(135deg, rgba(18, 18, 25, 0.95), rgba(12, 12, 17, 0.98));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      width: 100%;
      max-width: 980px;
      min-height: 540px;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 0, 0, 0.5);
      display: flex;
      position: relative;
      overflow: hidden;
      z-index: 2;
    }

    /* Lomo del Libro */
    .book-binding {
      width: 30px;
      background: linear-gradient(90deg, 
        rgba(0,0,0,0.6) 0%, 
        rgba(255,255,255,0.03) 50%, 
        rgba(0,0,0,0.6) 100%);
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }

    /* Páginas del Libro */
    .book-page {
      flex: 1;
      padding: 45px 50px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .book-page:first-child {
      border-right: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* PÁGINA IZQUIERDA: PERFIL */
    .page-header {
      margin-bottom: 25px;
    }

    .chapter-tag {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 8px;
      font-family: -apple-system, sans-serif;
    }

    .page-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      font-family: -apple-system, sans-serif;
    }

    .info-panel {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #64748b;
    }

    .info-value {
      color: #f1f5f9;
      font-weight: 600;
    }

    .book-quote {
      background: rgba(255, 255, 255, 0.015);
      border-left: 3px solid rgba(244, 114, 182, 0.4);
      padding: 14px 18px;
      border-radius: 0 10px 10px 0;
      font-style: italic;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
    }

    /* PÁGINA DERECHA: REPRODUCTOR AVANZADO */
    .now-playing-card {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .song-cover {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
    }

    .song-meta {
      flex: 1;
    }

    .song-title-main {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 3px;
      font-family: -apple-system, sans-serif;
    }

    .song-artist-main {
      font-size: 12px;
      color: #94a3b8;
      font-family: -apple-system, sans-serif;
    }

    /* Controles de reproducción completos */
    .player-controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 16px;
      transition: color 0.2s, transform 0.2s;
    }

    .ctrl-btn:hover {
      color: #ffffff;
      transform: scale(1.1);
    }

    .main-play-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      transition: transform 0.2s, background 0.2s;
    }

    .main-play-btn:hover {
      transform: scale(1.08);
      background: #f472b6;
      color: #ffffff;
    }

    /* Barra de progreso de la canción */
    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 12px;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-filled {
      width: 0%;
      height: 100%;
      background: #f472b6;
      border-radius: 2px;
      position: relative;
    }

    /* Control de Volumen */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #64748b;
    }

    .volume-slider {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      accent-color: #f472b6;
      cursor: pointer;
    }

    /* Playlist */
    .playlist-section-title {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 10px;
      font-family: -apple-system, sans-serif;
    }

    .tracks-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .track-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .track-item.active {
      background: rgba(244, 114, 182, 0.08);
      border-color: rgba(244, 114, 182, 0.3);
    }

    .track-thumb {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
    }

    .track-info {
      flex: 1;
    }

    .track-name {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      font-family: -apple-system, sans-serif;
    }

    .track-artist {
      font-size: 10px;
      color: #94a3b8;
      font-family: -apple-system, sans-serif;
    }

    /* Responsivo móvil */
    @media (max-width: 768px) {
      .open-book {
        flex-direction: column;
        max-width: 450px;
      }
      .book-binding {
        display: none;
      }
      .book-page {
        padding: 25px;
      }
      .book-page:first-child {
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="open-book">
    <div class="book-binding"></div>

    <!-- PÁGINA IZQUIERDA: PERFIL -->
    <div class="book-page">
      <div>
        <div class="page-header">
          <div class="chapter-tag">CAPÍTULO I — IDENTIDAD</div>
          <div class="page-title">ALLIE</div>
        </div>

        <div class="info-panel">
          <div class="info-row">
            <span class="info-label">Name</span>
            <span class="info-value">Allie</span>
          </div>
          <div class="info-row">
            <span class="info-label">País</span>
            <span class="info-value">Perú</span>
          </div>
          <div class="info-row">
            <span class="info-label">Username</span>
            <span class="info-value">Addictedtoyouu</span>
          </div>
        </div>
      </div>

      <div class="book-quote">
        "Echo de menos tú y yo aquí en mi cuarto, pero te lo..."
      </div>
    </div>

    <!-- PÁGINA DERECHA: REPRODUCTOR COMPLETO -->
    <div class="book-page">
      <div>
        <div class="chapter-tag">CAPÍTULO II — SONIDOS</div>
        
        <div class="now-playing-card" style="margin-top: 12px;">
          <div class="player-top">
            <img id="active-cover" src="https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg" class="song-cover" alt="Cover">
            <div class="song-meta">
              <div class="song-title-main" id="active-title">SUPERESTRELLA</div>
              <div class="song-artist-main" id="active-artist">Aitana</div>
            </div>
          </div>

          <!-- Controles: Anterior, Play/Pause, Siguiente -->
          <div class="player-controls-row">
            <button class="ctrl-btn" onclick="prevSong()" title="Anterior">⏮</button>
            <button class="main-play-btn" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn" onclick="nextSong()" title="Siguiente">⏭</button>
          </div>

          <!-- Barra de Progreso interactiva -->
          <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="progress-bar" id="progress-bar" onclick="setProgress(event)">
              <div class="progress-filled" id="progress-filled"></div>
            </div>
            <span id="total-duration">0:00</span>
          </div>

          <!-- Control de Volumen -->
          <div class="volume-container">
            <span>🔊</span>
            <input type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" id="volume-slider" oninput="setVolume(this.value)">
          </div>
        </div>

        <div class="playlist-section-title">PLAYLIST</div>
        <div class="tracks-list">
          <div class="track-item active" onclick="playSong(0)" id="track-0">
            <img src="https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg" class="track-thumb" alt="Superestrella">
            <div class="track-info">
              <div class="track-name">SUPERESTRELLA</div>
              <div class="track-artist">Aitana</div>
            </div>
          </div>

          <div class="track-item" onclick="playSong(1)" id="track-1">
            <img src="https://i.postimg.cc/50wYKF10/artworks-z-GXe-TIC6Z17nhvx-J-1v9QKQ-t500x500.jpg" class="track-thumb" alt="Mon Amour">
            <div class="track-info">
              <div class="track-name">Mon Amour (Remix)</div>
              <div class="track-artist">Zzoilo x Aitana</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player" src="Aitana - SUPERESTRELLA.mp3"></audio>

  <script>
    const playlist = [
      { 
        file: 'Aitana - SUPERESTRELLA.mp3', 
        title: 'SUPERESTRELLA', 
        artist: 'Aitana', 
        cover: 'https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg' 
      },
      { 
        file: 'zzoilo - Mon Amour (Remix).mp3', 
        title: 'Mon Amour (Remix)', 
        artist: 'Zzoilo x Aitana', 
        cover: 'https://i.postimg.cc/50wYKF10/artworks-z-GXe-TIC6Z17nhvx-J-1v9QKQ-t500x500.jpg' 
      }
    ];

    let currentIdx = 0;
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const activeTitle = document.getElementById('active-title');
    const activeArtist = document.getElementById('active-artist');
    const activeCover = document.getElementById('active-cover');
    const progressFilled = document.getElementById('progress-filled');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function playSong(index) {
      currentIdx = index;
      const song = playlist[currentIdx];
      audio.src = song.file;
      audio.play();
      
      playBtn.textContent = '❚❚';
      document.body.classList.add('playing');
      activeTitle.textContent = song.title;
      activeArtist.textContent = song.artist;
      activeCover.src = song.cover;

      document.querySelectorAll('.track-item').forEach((item, i) => {
        if (i === currentIdx) item.classList.add('active');
        else item.classList.remove('active');
      });
    }

    function togglePlay() {
      if (audio.paused) {
        if (!audio.currentTime) {
          playSong(0);
        } else {
          audio.play();
          playBtn.textContent = '❚❚';
          document.body.classList.add('playing');
        }
      } else {
        audio.pause();
        playBtn.textContent = '▶';
        document.body.classList.remove('playing');
      }
    }

    function nextSong() {
      currentIdx = (currentIdx + 1) % playlist.length;
      playSong(currentIdx);
    }

    function prevSong() {
      currentIdx = (currentIdx - 1 + playlist.length) % playlist.length;
      playSong(currentIdx);
    }

    // Actualizar barra de progreso y tiempos
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFilled.style.width = `${percent}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        totalDurationEl.textContent = formatTime(audio.duration);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    // Permitir hacer clic en la barra para adelantar/atrasar
    progressBar.addEventListener('click', (e) => {
      const width = progressBar.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;
      if (duration) {
        audio.currentTime = (clickX / width) * duration;
      }
    });

    // Control de volumen
    function setVolume(val) {
      audio.volume = val;
    }

    // Cuando termina una canción, pasa automáticamente a la siguiente
    audio.addEventListener('ended', () => {
      nextSong();
    });
  </script>

</body>
</html>
