<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allie's Cyber Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, sans-serif;
    }

    :root {
      --theme-bg: #030305;
      --accent-color: #f472b6;
      --accent-glow: rgba(244, 114, 182, 0.4);
    }

    body.theme-0 {
      --theme-bg: linear-gradient(135deg, #180812, #2c0b25, #080206);
      --accent-color: #f472b6;
      --accent-glow: rgba(244, 114, 182, 0.5);
    }
    body.theme-1 {
      --theme-bg: linear-gradient(135deg, #05101a, #0c203b, #02060d);
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.5);
    }
    body.theme-2 {
      --theme-bg: linear-gradient(135deg, #140a24, #26124a, #06020c);
      --accent-color: #c084fc;
      --accent-glow: rgba(192, 132, 252, 0.5);
    }

    body {
      background-color: #030305;
      color: #2b1c14;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
      transition: background 1.5s ease;
    }

    /* OVERLAY GIF DE INTRO (Única vez) */
    .intro-gif-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      background-image: url('https://i.postimg.cc/Nfq1QBLP/f87ea7ba7524072a16622a83b588f48e-(1).gif');
      background-size: cover;
      background-position: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .intro-gif-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* CONTENEDOR PRINCIPAL (ESTILO LIBRO INICIAL) */
    .main-container {
      background: #fdfbf7;
      border: 3px solid #4a2e1d;
      border-radius: 20px;
      width: 100%;
      max-width: 1000px;
      min-height: 580px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      display: flex;
      position: relative;
      overflow: hidden;
      transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* CUANDO REPRODUCE: CAMBIA A SPACE FUTURISTA PROFESIONAL EN LAS ESQUINAS */
    body.playing .main-container {
      background: rgba(12, 12, 18, 0.95);
      backdrop-filter: blur(30px);
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 60px var(--accent-glow), 0 40px 90px rgba(0, 0, 0, 0.9);
      color: #f1f5f9;
      flex-direction: column;
      padding: 30px;
      justify-content: space-between;
    }

    /* LOMO CENTRAL (Solo visible en modo libro) */
    .book-binding {
      width: 26px;
      background: linear-gradient(90deg, #23140c 0%, #4a2e1d 50%, #23140c 100%);
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    body.playing .book-binding {
      opacity: 0;
      pointer-events: none;
    }

    /* VISTA DE LIBRO (PÁGINAS) */
    .book-view-left, .book-view-right {
      flex: 1;
      padding: 45px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.5s ease;
      background-image: repeating-linear-gradient(180deg, transparent, transparent 31px, rgba(139, 107, 79, 0.04) 32px);
    }

    .book-view-left {
      border-right: 1px solid #e7dfd1;
    }

    body.playing .book-view-left, 
    body.playing .book-view-right {
      display: none; /* Oculto al reproducir para dar paso al Space Futurista */
    }

    /* VISTA SPACE FUTURISTA (PROFESIONAL EN LAS ESQUINAS) */
    .cyber-space-view {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
      flex-direction: column;
      justify-content: space-between;
      min-height: 520px;
    }

    body.playing .cyber-space-view {
      display: flex;
    }

    /* FILA SUPERIOR: ESQUINAS PROFESIONALES */
    .cyber-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .corner-profile {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 15px 20px;
      min-width: 220px;
    }

    .corner-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .corner-info {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* NAVEGACIÓN DE PESTAÑAS EN LA ESQUINA SUPERIOR DERECHA */
    .corner-nav-tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px;
      border-radius: 14px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-color);
      color: #030305;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* CENTRO DEL SPACE: REPRODUCTOR GRANDE O PIZARRA DE DIBUJO */
    .cyber-center-content {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 20px 0;
    }

    /* REPRODUCTOR GRANDE PROFESIONAL */
    .massive-player {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.5s ease;
    }

    .massive-cover {
      width: 140px;
      height: 140px;
      border-radius: 16px;
      object-fit: cover;
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 25px var(--accent-glow);
      margin-bottom: 15px;
    }

    .massive-song-title {
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 4px;
      text-align: center;
    }

    .massive-song-artist {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 15px;
      text-align: center;
    }

    .massive-controls {
      display: flex;
      align-items: center;
      gap: 25px;
      margin-bottom: 15px;
    }

    .m-ctrl-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
      transition: color 0.3s;
    }

    .m-ctrl-btn:hover { color: var(--accent-color); }

    .m-play-btn {
      background: var(--accent-color);
      color: #030305;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px var(--accent-glow);
      transition: transform 0.2s;
    }

    .m-play-btn:hover { transform: scale(1.1); }

    .massive-progress {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: #94a3b8;
    }

    .progress-bar-bg {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* PIZARRA DE DIBUJO INTERACTIVA CON LÁPIZ */
    .drawing-board-container {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 650px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 15px;
    }

    .drawing-board-container.active {
      display: flex;
    }

    #draw-canvas {
      background: #1a1a24;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      cursor: crosshair;
      touch-action: none;
    }

    .drawing-tools {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      align-items: center;
    }

    .draw-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .draw-btn:hover { background: var(--accent-color); color: #030305; }

    /* FILA INFERIOR: PLAYLIST EN LAS ESQUINAS */
    .cyber-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 15px;
    }

    .corner-playlist {
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 15px;
      border-radius: 14px;
      align-items: center;
      flex: 1;
      max-width: 450px;
      overflow-x: auto;
    }

    .mini-track {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .mini-track:hover, .mini-track.active {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
      background: rgba(255, 255, 255, 0.08);
    }

    .mini-thumb {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
    }

    /* ELEMENTOS ESTILO LIBRO (MODO INICIAL) */
    .page-title {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #2b180d;
      margin-bottom: 20px;
    }

    .cyber-card {
      background: rgba(92, 58, 33, 0.04);
      border: 1px solid rgba(92, 58, 33, 0.12);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .chapter-tag {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8c6d53;
      font-weight: 700;
    }

    .nav-arrow-btn {
      background: rgba(92, 58, 33, 0.08);
      border: 1px solid rgba(92, 58, 33, 0.2);
      color: #3b2416;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .main-container { max-width: 450px; }
      .book-binding { display: none; }
      .cyber-header-row, .cyber-footer-row { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body class="theme-0">

  <!-- OVERLAY GIF DE INTRO (Única vez) -->
  <div class="intro-gif-overlay" id="intro-overlay"></div>

  <div class="main-container" id="main-container">
    <div class="book-binding"></div>

    <!-- VISTA 1: LIBRO (CUANDO ESTÁ PAUSADO) -->
    <div class="book-view-left">
      <div>
        <div class="chapter-tag">CAPÍTULO I — IDENTIDAD</div>
        <div style="margin-top: 20px;">
          <div class="page-title">ALLIE</div>
          <div class="cyber-card"><span style="font-size:11px; text-transform:uppercase; color:#7c5c40;">Name</span><strong>Allie</strong></div>
          <div class="cyber-card"><span style="font-size:11px; text-transform:uppercase; color:#7c5c40;">País</span><strong>Perú</strong></div>
          <div class="cyber-card"><span style="font-size:11px; text-transform:uppercase; color:#7c5c40;">Username</span><strong>Addictedtoyouu</strong></div>
        </div>
      </div>
      <div style="font-size: 11px; color: #8c6d53;">ALLIE'S SPACE — 2026</div>
    </div>

    <div class="book-view-right">
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <div class="chapter-tag">CAPÍTULO II — SONIDOS</div>
        </div>
        <!-- Reproductor clásico vista libro -->
        <div style="background: #f7f3ed; border: 1px solid #e2d7c5; border-radius: 14px; padding: 15px; margin-bottom: 15px;">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
            <img id="book-cover" src="https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg" style="width:50px; height:50px; border-radius:8px; object-fit:cover;">
            <div>
              <div id="book-title" style="font-size:12px; font-weight:800; color:#2b180d;">SUPERESTRELLA</div>
              <div id="book-artist" style="font-size:10px; color:#7c5c40;">Aitana</div>
            </div>
          </div>
          <div style="display: flex; justify-content: center; align-items: center; gap: 15px;">
            <button onclick="togglePlay()" style="background:#3b2416; color:#fff; border:none; width:34px; height:34px; border-radius:50%; cursor:pointer; font-weight:bold;" id="book-play-btn">▶</button>
          </div>
        </div>
      </div>
      <div style="text-align: right;"><button class="nav-arrow-btn" onclick="togglePlay()">Reproducir para entrar al Cyber Space ➔</button></div>
    </div>


    <!-- VISTA 2: SPACE FUTURISTA PROFESIONAL (CUANDO REPRODUCE) -->
    <div class="cyber-space-view">
      <!-- HEADER ESQUINAS -->
      <div class="cyber-header-row">
        <div class="corner-profile">
          <div class="corner-title">ALLIE</div>
          <div class="corner-info">Peru • @Addictedtoyouu<br>Cyber Space Active ⚡</div>
        </div>
        <div class="corner-nav-tabs">
          <button class="tab-btn active" id="tab-player" onclick="switchTab('player')">🎵 Reproductor</button>
          <button class="tab-btn" id="tab-canvas" onclick="switchTab('canvas')">✏️ Pizarra / Lápiz</button>
        </div>
      </div>

      <!-- CENTRO: REPRODUCTOR GRANDE O PIZARRA -->
      <div class="cyber-center-content">
        <!-- REPRODUCTOR MASIVO -->
        <div class="massive-player" id="view-massive-player">
          <img id="cyber-cover" src="https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg" class="massive-cover" alt="Cover">
          <div class="massive-song-title" id="cyber-title">SUPERESTRELLA</div>
          <div class="massive-song-artist" id="cyber-artist">Aitana</div>

          <div class="massive-controls">
            <button class="m-ctrl-btn" onclick="prevSong()">⏮</button>
            <button class="m-play-btn" id="cyber-play-btn" onclick="togglePlay()">❚❚</button>
            <button class="m-ctrl-btn" onclick="nextSong()">⏭</button>
          </div>

          <div class="massive-progress">
            <span id="c-time">0:00</span>
            <div class="progress-bar-bg" onclick="setProgress(event)">
              <div class="progress-bar-fill" id="c-progress"></div>
            </div>
            <span id="t-duration">0:00</span>
          </div>
        </div>

        <!-- PIZARRA DE DIBUJO CON LÁPIZ -->
        <div class="drawing-board-container" id="view-drawing-board">
          <canvas id="draw-canvas" width="520" height="260"></canvas>
          <div class="drawing-tools">
            <button class="draw-btn" onclick="clearCanvas()">🧹 Limpiar Pizarra</button>
            <span style="font-size: 11px; color: #94a3b8;">Usa tu mouse para dibujar o escribir libremente</span>
          </div>
        </div>
      </div>

      <!-- FOOTER ESQUINAS: PLAYLIST Y VOLUMEN -->
      <div class="cyber-footer-row">
        <div class="corner-playlist" id="cyber-playlist">
          <!-- Playlist generada por JS -->
        </div>
        <div style="background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); padding:10px 15px; border-radius:14px; display:flex; align-items:center; gap:8px; font-size:11px; color:#94a3b8;">
          <span>🔊</span>
          <input type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)" style="accent-color: var(--accent-color); cursor:pointer;">
        </div>
      </div>
    </div>

  </div>

  <audio id="audio-player" src="Aitana - SUPERESTRELLA.mp3"></audio>

  <script>
    const playlist = [
      { file: 'Aitana - SUPERESTRELLA.mp3', title: 'SUPERESTRELLA', artist: 'Aitana', cover: 'https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg' },
      { file: 'zzoilo - Mon Amour (Remix).mp3', title: 'Mon Amour (Remix)', artist: 'Zzoilo x Aitana', cover: 'https://i.postimg.cc/50wYKF10/artworks-z-GXe-TIC6Z17nhvx-J-1v9QKQ-t500x500.jpg' },
      { file: 'Sabrina Carpenter - Juno.mp3', title: 'Juno', artist: 'Sabrina Carpenter', cover: 'https://i.postimg.cc/gk8nshzS/250x250-000000-80-0-0-(1).jpg' }
    ];

    let currentIdx = 0;
    let hasPlayedIntro = false;
    const audio = document.getElementById('audio-player');
    const introOverlay = document.getElementById('intro-overlay');

    function updateTheme(index) {
      document.body.classList.remove('theme-0', 'theme-1', 'theme-2');
      document.body.classList.add(`theme-${index}`);
    }

    function renderCyberPlaylist() {
      const container = document.getElementById('cyber-playlist');
      container.innerHTML = playlist.map((song, i) => `
        <div class="mini-track ${i === currentIdx ? 'active' : ''}" onclick="playSong(${i})">
          <img src="${song.cover}" class="mini-thumb">
          <div style="font-size:11px;">
            <div style="font-weight:700; color:#fff;">${song.title}</div>
            <div style="font-size:9px; color:#94a3b8;">${song.artist}</div>
          </div>
        </div>
      `).join('');
    }

    function updateUI() {
      const song = playlist[currentIdx];
      document.getElementById('book-cover').src = song.cover;
      document.getElementById('book-title').textContent = song.title;
      document.getElementById('book-artist').textContent = song.artist;

      document.getElementById('cyber-cover').src = song.cover;
      document.getElementById('cyber-title').textContent = song.title;
      document.getElementById('cyber-artist').textContent = song.artist;
      renderCyberPlaylist();
    }

    function triggerStartSequence() {
      if (!hasPlayedIntro) {
        hasPlayedIntro = true;
        introOverlay.classList.add('active');

        setTimeout(() => {
          introOverlay.classList.remove('active');
          document.body.classList.add('playing');
        }, 3500);
      } else {
        document.body.classList.add('playing');
      }
    }

    function playSong(index) {
      currentIdx = index;
      updateTheme(currentIdx);
      audio.src = playlist[currentIdx].file;
      audio.play();

      triggerStartSequence();
      document.getElementById('book-play-btn').textContent = '❚❚';
      document.getElementById('cyber-play-btn').textContent = '❚❚';
      updateUI();
    }

    function togglePlay() {
      if (audio.paused) {
        if (!audio.currentTime) {
          playSong(0);
        } else {
          audio.play();
          triggerStartSequence();
          document.getElementById('book-play-btn').textContent = '❚❚';
          document.getElementById('cyber-play-btn').textContent = '❚❚';
        }
      } else {
        audio.pause();
        document.body.classList.remove('playing');
        document.getElementById('book-play-btn').textContent = '▶';
        document.getElementById('cyber-play-btn').textContent = '▶';
      }
    }

    function nextSong() {
      currentIdx = (currentIdx + 1) % playlist.length;
      playSong(currentIdx);
    }

    function prevSong() {
      currentIdx = (currentIdx - 1 + playlist.length) % playlist.length;
      playSong(currentIdx);
    }

    function switchTab(tab) {
      const playerView = document.getElementById('view-massive-player');
      const canvasView = document.getElementById('view-drawing-board');
      const btnPlayer = document.getElementById('tab-player');
      const btnCanvas = document.getElementById('tab-canvas');

      if (tab === 'player') {
        playerView.style.display = 'flex';
        canvasView.classList.remove('active');
        btnPlayer.classList.add('active');
        btnCanvas.classList.remove('active');
      } else {
        playerView.style.display = 'none';
        canvasView.classList.add('active');
        btnCanvas.classList.add('active');
        btnPlayer.classList.remove('active');
      }
    }

    // Configuración de la Pizarra de Dibujo (Lápiz)
    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    let painting = false;

    function startPosition(e) {
      painting = true;
      draw(e);
    }

    function endedPosition() {
      painting = false;
      ctx.beginPath();
    }

    function draw(e) {
      if (!painting) return;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#f472b6';

      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', endedPosition);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startPosition);
    canvas.addEventListener('touchend', endedPosition);
    canvas.addEventListener('touchmove', draw);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    audio.addEventListener('timeupdate', () => {
      const fill = document.getElementById('c-progress');
      const cTime = document.getElementById('c-time');
      const tDur = document.getElementById('t-duration');
      if (audio.duration && fill) {
        fill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
        cTime.textContent = formatTime(audio.currentTime);
        tDur.textContent = formatTime(audio.duration);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      document.getElementById('t-duration').textContent = formatTime(audio.duration);
    });

    function setProgress(e) {
      const bar = e.currentTarget;
      audio.currentTime = (e.offsetX / bar.clientWidth) * audio.duration;
    }

    function setVolume(val) { audio.volume = val; }
    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.addEventListener('ended', nextSong);
    renderCyberPlaylist();
  </script>

</body>
</html>
