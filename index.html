
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Lofi Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0b0e;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo ambiental suave */
    .ambient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, rgba(30, 27, 75, 0.4) 0%, rgba(11, 11, 14, 0.9) 80%);
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      display: flex;
      gap: 20px;
      max-width: 1100px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
      z-index: 2;
      position: relative;
    }

    /* Tarjetas estilo Aesthetic Glass */
    .card {
      background: rgba(18, 18, 24, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 24px;
      padding: 24px;
      width: 320px;
      height: 460px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-4px);
    }

    /* Tarjeta 1: Perfil */
    .profile-header {
      text-align: center;
      margin-bottom: 15px;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 12px auto;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .profile-sub {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .profile-info-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 12px 16px;
      margin-top: 10px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: #64748b;
    }

    .info-value {
      color: #cbd5e1;
      font-weight: 500;
    }

    .quote-box {
      font-size: 12px;
      font-style: italic;
      color: #94a3b8;
      text-align: center;
      margin-top: 10px;
      padding: 0 10px;
    }

    /* Tarjeta 2: Reproductor Lofi */
    .player-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      height: 100%;
      justify-content: space-between;
    }

    .vinyl-disc {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      border: 3px solid rgba(255,255,255,0.08);
      margin: 15px 0;
    }

    .track-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    .track-artist {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 15px;
    }

    .player-controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    /* Tarjeta 3: Enlaces / Links */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .link-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 12px 16px;
      border-radius: 14px;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s, border-color 0.2s;
    }

    .link-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="ambient-bg"></div>

  <div class="app-container">
    
    <!-- Tarjeta 1: Perfil -->
    <div class="card">
      <div class="profile-header">
        <img src="https://xatimg.com/image/6psP1KrS59m9.jpg" alt="Avatar" class="profile-avatar">
        <div class="profile-name">AITANA</div>
        <div class="profile-sub">Cataluña</div>
      </div>

      <div class="profile-info-box">
        <div class="info-row">
          <span class="info-label">Name</span>
          <span class="info-value">Allie</span>
        </div>
        <div class="info-row">
          <span class="info-label">País</span>
          <span class="info-value">Perú</span>
        </div>
        <div class="info-row">
          <span class="info-label">Username</span>
          <span class="info-value">Addictedtoyou</span>
        </div>
      </div>

      <div class="quote-box">
        "Echo de menos tú y yo aquí en mi cuarto, pero te lo..."
      </div>
    </div>

    <!-- Tarjeta 2: Reproductor -->
    <div class="card">
      <div class="player-content">
        <div class="profile-sub" style="margin-top: 5px;">NOW PLAYING</div>
        <div>
          <img src="https://i.postimg.cc/3wcdxfVc/1900x1900-000000-80-0-0-(1).jpg" alt="Vinyl" class="vinyl-disc" id="vinyl">
          <div class="track-title" id="title">Superestrella</div>
          <div class="track-artist" id="artist">Aitana</div>
        </div>

        <div class="player-controls">
          <div class="ctrl-btn" onclick="prevSong()">⏮</div>
          <div class="ctrl-btn" onclick="togglePlay()" id="play-btn">▶</div>
          <div class="ctrl-btn" onclick="nextSong()">⏭</div>
        </div>
      </div>
    </div>

    <!-- Tarjeta 3: Enlaces y Comunidad -->
    <div class="card">
      <div class="profile-header" style="margin-bottom: 5px;">
        <div class="profile-name" style="font-size: 16px;">EXPLorar</div>
        <div class="profile-sub">Menu</div>
      </div>

      <div class="links-container">
        <a href="#" class="link-btn"><span>✨ Gallery</span> <span>→</span></a>
        <a href="#" class="link-btn"><span>💬 Friends</span> <span>→</span></a>
        <a href="#" class="link-btn"><span>🎵 Playlist</span> <span>→</span></a>
        <a href="#" class="link-btn"><span>🌐 Redes</span> <span>→</span></a>
      </div>
    </div>

  </div>

  <audio id="audio" src="MGMT - Kids.mp3"></audio>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const vinyl = document.getElementById('vinyl');

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = '❚❚';
        vinyl.style.animation = 'spinDisc 10s linear infinite';
      } else {
        audio.pause();
        playBtn.textContent = '▶';
        vinyl.style.animation = 'none';
      }
    }

    function prevSong() {
      // Espacio para programar anterior
    }

    function nextSong() {
      // Espacio para programar siguiente
    }
  </script>

  <style>
    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

</body>
</html>
