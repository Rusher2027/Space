<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allie's Cyber Book Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    /* Colores dinámicos por canción mediante variables CSS */
    :root {
      --theme-color-primary: #ec4899;
      --theme-color-secondary: #a855f7;
      --theme-glow: rgba(236, 72, 153, 0.4);
      --theme-bg: linear-gradient(135deg, #140510, #22081c, #0a0208);
    }

    /* TEMA CANCIÓN 0: SUPERESTRELLA (Rosa / Violeta) */
    body.theme-0 {
      --theme-color-primary: #f472b6;
      --theme-color-secondary: #c084fc;
      --theme-glow: rgba(244, 114, 182, 0.5);
      --theme-bg: linear-gradient(135deg, #1e0b17, #2c0b25, #0d030b);
    }

    /* TEMA CANCIÓN 1: MON AMOUR REMIX (Azul Eléctrico / Cian Ciberpunk) */
    body.theme-1 {
      --theme-color-primary: #38bdf8;
      --theme-color-secondary: #6366f1;
      --theme-glow: rgba(56, 189, 248, 0.5);
      --theme-bg: linear-gradient(135deg, #061527, #0c203b, #030a14);
    }

    /* TEMA CANCIÓN 2: JUNO (Dorado Warm / Magenta Sunset) */
    body.theme-2 {
      --theme-color-primary: #fbbf24;
      --theme-color-secondary: #f43f5e;
      --theme-glow: rgba(251, 191, 36, 0.5);
      --theme-bg: linear-gradient(135deg, #231203, #331509, #0f0701);
    }

    body {
      background-color: #030305;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      overflow-x: hidden;
      position: relative;
      transition: background 1.2s ease;
    }

    /* Fondo dinámico al reproducir música */
    body.playing {
      background: var(--theme-bg);
      background-size: 400% 400%;
      animation: themeGradient 10s ease infinite;
    }

    @keyframes themeGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Contenedor Principal: El Libro Futurista */
    .open-book {
      background: rgba(15, 15, 22, 0.92);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      width: 100%;
      max-width: 980px;
      min-height: 560px;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.9);
      display: flex;
      position: relative;
      overflow: hidden;
      z-index: 2;
      transition: all 1s ease;
    }

    /* Aura Neón alrededor del libro al sonar la música */
    body.playing .open-book {
      background: #231208 !important; /* Hojas blancas, pasta café */
      border: 2px solid var(--theme-color-primary);
      box-shadow: 0 0 50px var(--theme-glow), 0 0 100px rgba(0, 0, 0, 0.5), 0 40px 80px rgba(0, 0, 0, 0.9);
      animation: auraPulse 3s ease-in-out infinite;
    }

    @keyframes auraPulse {
      0%, 100% {
        box-shadow: 0 0 35px var(--theme-glow), 0 40px 80px rgba(0, 0, 0, 0.9);
      }
      50% {
        box-shadow: 0 0 70px var(--theme-glow), 0 0 110px var(--theme-color-secondary), 0 40px 80px rgba(0, 0, 0, 0.9);
      }
    }

    body.playing .book-page {
      background: #fdfbf7 !important;
      color: #1e120b !important;
    }

    /* Lomo Central Holo-Binding */
    .book-binding {
      width: 24px;
      background: linear-gradient(90deg, 
        rgba(0,0,0,0.7) 0%, 
        rgba(255,255,255,0.05) 50%, 
        rgba(0,0,0,0.7) 100%);
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
      transition: background 1s ease;
    }

    body.playing .book-binding {
      background: linear-gradient(90deg, #180b04 0%, #3a1d0d 50%, #180b04 100%);
    }

    /* Páginas del Libro */
    .book-page {
      flex: 1;
      padding: 45px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: transparent;
      color: #f1f5f9;
      transition: background 1s ease, color 1s ease, transform 0.5s ease, opacity 0.5s ease;
    }

    .book-page.page-flip-effect {
      transform: rotateY(-15deg) scale(0.98);
      opacity: 0.3;
    }

    .book-page:first-child {
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    body.playing .book-page:first-child {
      border-right: 1px solid #e7dfd1 !important;
    }

    /* Control de Navegación de Páginas */
    .page-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .chapter-tag {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 700;
      transition: color 0.5s ease;
    }

    body.playing .chapter-tag { color: #8c6d53; }

    .nav-arrow-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    body.playing .nav-arrow-btn {
      background: rgba(92, 58, 33, 0.08);
      border-color: rgba(92, 58, 33, 0.2);
      color: #3b2416;
    }

    .nav-arrow-btn:hover {
      background: var(--theme-glow);
      border-color: var(--theme-color-primary);
      transform: translateX(3px);
    }

    /* PÁGINA IZQUIERDA: PERFIL */
    .page-title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      margin-bottom: 20px;
      transition: color 0.5s ease;
    }

    body.playing .page-title { color: #2b180d; }

    .cyber-info-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .cyber-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      transition: all 0.4s ease;
    }

    body.playing .cyber-card {
      background: rgba(92, 58, 33, 0.04);
      border-color: rgba(92, 58, 33, 0.12);
    }

    .cyber-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #64748b;
    }

    body.playing .cyber-label { color: #7c5c40; }

    .cyber-value {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
    }

    body.playing .cyber-value { color: #3b2416; }

    .book-quote {
      background: rgba(255, 255, 255, 0.015);
      border-left: 3px solid var(--theme-color-primary);
      padding: 14px 18px;
      border-radius: 0 12px 12px 0;
      font-style: italic;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      transition: all 0.5s ease;
    }

    body.playing .book-quote {
      background: rgba(92, 58, 33, 0.05);
      border-left-color: #8c6d53;
      color: #5c4033;
    }

    /* PÁGINA DERECHA: REPRODUCTOR FUTURISTA Y CIBERNÉTICO */
    .futuristic-player {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 15px;
      position: relative;
      transition: all 0.5s ease;
    }

    body.playing .futuristic-player {
      background: rgba(92, 58, 33, 0.05);
      border: 1.5px solid var(--theme-color-primary);
      box-shadow: 0 0 20px var(--theme-glow);
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .song-cover {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
      border: 1px solid var(--theme-color-primary);
      transition: border-color 0.5s ease;
    }

    .eq-bar-container {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 14px;
      margin-top: 4px;
    }

    .eq-bar {
      width: 3px;
      background: var(--theme-color-primary);
      border-radius: 2px;
      height: 4px;
      transition: background 0.5s ease;
    }

    body.playing .eq-bar:nth-child(1) { animation: eqAnim 0.8s ease-in-out infinite alternate; }
    body.playing .eq-bar:nth-child(2) { animation: eqAnim 1.1s ease-in-out infinite alternate 0.2s; }
    body.playing .eq-bar:nth-child(3) { animation: eqAnim 0.7s ease-in-out infinite alternate 0.4s; }
    body.playing .eq-bar:nth-child(4) { animation: eqAnim 0.9s ease-in-out infinite alternate 0.1s; }

    @keyframes eqAnim {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    .song-title-main {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 2px;
    }

    body.playing .song-title-main { color: #2b180d; }

    .song-artist-main {
      font-size: 11px;
      color: #94a3b8;
    }

    body.playing .song-artist-main { color: #7c5c40; }

    .player-controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-bottom: 10px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    body.playing .ctrl-btn { color: #7c5c40; }

    .ctrl-btn:hover {
      color: var(--theme-color-primary);
      transform: scale(1.15);
    }

    .main-play-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    body.playing .main-play-btn {
      background: var(--theme-color-primary);
      color: #ffffff;
      box-shadow: 0 0 15px var(--theme-glow);
    }

    .main-play-btn:hover {
      transform: scale(1.08);
    }

    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      color: #64748b;
      margin-bottom: 10px;
    }

    body.playing .progress-container { color: #7c5c40; }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    body.playing .progress-bar { background: rgba(92, 58, 33, 0.15); }

    .progress-filled {
      width: 0%;
      height: 100%;
      background: var(--theme-color-primary);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--theme-glow);
      transition: background 0.5s ease;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: #64748b;
    }

    body.playing .volume-container { color: #7c5c40; }

    .volume-slider {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      accent-color: var(--theme-color-primary);
      cursor: pointer;
    }

    /* LISTA DE CANCIONES CIBERNÉTICA */
    .tracks-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 130px;
      overflow-y: auto;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    body.playing .track-item {
      background: rgba(92, 58, 33, 0.03);
      border-color: rgba(92, 58, 33, 0.08);
    }

    .track-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--theme-color-primary);
    }

    /* Canción Activa con Brillo Futurista */
    .track-item.active {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--theme-color-primary);
      box-shadow: 0 0 12px var(--theme-glow);
    }

    body.playing .track-item.active {
      background: rgba(92, 58, 33, 0.12);
      border-color: var(--theme-color-primary);
    }

    .track-thumb {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      object-fit: cover;
    }

    .track-info { flex: 1; }

    .track-name {
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
    }

    body.playing .track-name { color: #2b180d; }

    .track-artist {
      font-size: 9px;
      color: #94a3b8;
    }

    body.playing .track-artist { color: #7c5c40; }

    @media (max-width: 768px) {
      .open-book {
        flex-direction: column;
        max-width: 450px;
      }
      .book-binding { display: none; }
      .book-page { padding: 25px; }
    }
  </style>
</head>
<body class="theme-0">

  <div class="open-book">
    <div class="book-binding"></div>

    <!-- PÁGINA IZQUIERDA -->
    <div class="book-page" id="left-page">
      <div>
        <div class="page-nav-bar">
          <div class="chapter-tag" id="left-chapter-tag">CAPÍTULO I — IDENTIDAD</div>

        <div id="left-content">
          <div class="page-title">ALLIE</div>

          <div class="cyber-info-grid">

      <div class="book-quote" id="left-quote">

    <!-- PÁGINA DERECHA -->
    <div class="book-page" id="right-page">

                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>

              </div>

            <div class="player-controls-row">
              <button class="ctrl-btn" onclick="prevSong()" title="Anterior">⏮</button>

              <button class="ctrl-btn" onclick="nextSong()" title="Siguiente">⏭</button>

            <div class="progress-container">

            <div class="track-item" onclick="playSong(2)" id="track-2">

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player" src="Aitana - SUPERESTRELLA.mp3"></audio>

  <script>
    const playlist = [
      { file: 'Aitana - SUPERESTRELLA.mp3', title: 'SUPERESTRELLA', artist: 'Aitana', cover: 'https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg' },
      { file: 'zzoilo - Mon Amour (Remix).mp3', title: 'Mon Amour (Remix)', artist: 'Zzoilo x Aitana', cover: 'https://i.postimg.cc/50wYKF10/artworks-z-GXe-TIC6Z17nhvx-J-1v9QKQ-t500x500.jpg' },
      { file: 'Sabrina Carpenter - Juno.mp3', title: 'Juno', artist: 'Sabrina Carpenter', cover: 'https://i.postimg.cc/gk8nshzS/250x250-000000-80-0-0-(1).jpg' }
    ];

    let currentIdx = 0;
    let pageState = 1;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const activeTitle = document.getElementById('active-title');
    const activeArtist = document.getElementById('active-artist');
    const activeCover = document.getElementById('active-cover');
    const progressFilled = document.getElementById('progress-filled');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');

    const leftPage = document.getElementById('left-page');
    const rightPage = document.getElementById('right-page');
    const leftChapterTag = document.getElementById('left-chapter-tag');
    const leftContent = document.getElementById('left-content');
    const leftQuote = document.getElementById('left-quote');
    const rightChapterTag = document.getElementById('right-chapter-tag');
    const rightContent = document.getElementById('right-content');

    function updateTheme(index) {
      document.body.classList.remove('theme-0', 'theme-1', 'theme-2');
      document.body.classList.add(`theme-${index}`);
    }

    function flipPageNext() {
      leftPage.classList.add('page-flip-effect');
      rightPage.classList.add('page-flip-effect');

      setTimeout(() => {
        if (pageState === 1) {
          pageState = 2;
          leftChapterTag.textContent = 'CAPÍTULO III — COMUNIDAD';
          leftContent.innerHTML = `
            <div class="page-title" style="font-size: 28px;">GALERÍA & REDES</div>
            <div class="cyber-info-grid">
              <div class="cyber-card" style="cursor: pointer;" onclick="alert('Sección de Fotos')">
                <span class="cyber-label">Galería</span>
                <span class="cyber-value">📷 Fotos</span>
              </div>
              <div class="cyber-card" style="cursor: pointer;" onclick="alert('Sección de Amigos')">
                <span class="cyber-label">Comunidad</span>
                <span class="cyber-value">💬 Amigos</span>
              </div>
            </div>
          `;
          leftQuote.textContent = '"Un espacio especial renovado para compartir recuerdos."';
          
          rightChapterTag.textContent = 'FIN DEL LIBRO';
          rightContent.innerHTML = `
            <div style="text-align: center; padding: 40px 20px;">
              <div class="page-title" style="font-size: 24px; margin-bottom: 15px;">ALLIE'S SPACE</div>
              <p style="font-size: 13px; opacity: 0.8; line-height: 1.6;">Gracias por visitar este rincón interactivo. Diseñado con estilo y música.</p>
            </div>
          `;
        } else {
          pageState = 1;
          leftChapterTag.textContent = 'CAPÍTULO I — IDENTIDAD';
          leftContent.innerHTML = `
            <div class="page-title">ALLIE</div>
            <div class="cyber-info-grid">
              <div class="cyber-card">
                <span class="cyber-label">Name</span>
                <span class="cyber-value">Allie</span>
              </div>
              <div class="cyber-card">
                <span class="cyber-label">País</span>
                <span class="cyber-value">Perú</span>
              </div>
              <div class="cyber-card">
                <span class="cyber-label">Username</span>
                <span class="cyber-value">Addictedtoyouu</span>
              </div>
            </div>
          `;
          leftQuote.textContent = '"Echo de menos tú y yo aquí en mi cuarto, pero te lo..."';

          rightChapterTag.textContent = 'CAPÍTULO II — SONIDOS';
          rightContent.innerHTML = `
            <div class="futuristic-player">
              <div class="player-top">
                <img id="active-cover" src="${playlist[currentIdx].cover}" class="song-cover" alt="Cover">
                <div style="flex: 1;">
                  <div class="song-title-main" id="active-title">${playlist[currentIdx].title}</div>
                  <div class="song-artist-main" id="active-artist">${playlist[currentIdx].artist}</div>
                  <div class="eq-bar-container">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                  </div>
                </div>
              </div>

              <div class="player-controls-row">
                <button class="ctrl-btn" onclick="prevSong()" title="Anterior">⏮</button>
                <button class="main-play-btn" id="play-btn" onclick="togglePlay()">${audio.paused ? '▶' : '❚❚'}</button>
                <button class="ctrl-btn" onclick="nextSong()" title="Siguiente">⏭</button>
              </div>

              <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar" onclick="setProgress(event)">
                  <div class="progress-filled" id="progress-filled"></div>
                </div>
                <span id="total-duration">0:00</span>
              </div>

              <div class="volume-container">
                <span>🔊</span>
                <input type="range" min="0" max="1" step="0.01" value="${audio.volume}" class="volume-slider" id="volume-slider" oninput="setVolume(this.value)">
              </div>
            </div>

            <div class="chapter-tag" style="margin-bottom: 8px;">PLAYLIST / CANCIONES</div>
            <div class="tracks-list" id="playlist-container">
              ${playlist.map((song, i) => `
                <div class="track-item ${i === currentIdx ? 'active' : ''}" onclick="playSong(${i})" id="track-${i}">
                  <img src="${song.cover}" class="track-thumb" alt="${song.title}">
                  <div class="track-info">
                    <div class="track-name">${song.title}</div>
                    <div class="track-artist">${song.artist}</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }
      }, 250);

      setTimeout(() => {
        leftPage.classList.remove('page-flip-effect');
        rightPage.classList.remove('page-flip-effect');
      }, 500);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function playSong(index) {
      currentIdx = index;
      updateTheme(currentIdx);
      const song = playlist[currentIdx];
      audio.src = song.file;
      audio.play();
      
      const pBtn = document.getElementById('play-btn');
      if(pBtn) pBtn.textContent = '❚❚';
      document.body.classList.add('playing');
      
      if(activeTitle) activeTitle.textContent = song.title;
      if(activeArtist) activeArtist.textContent = song.artist;
      if(activeCover) activeCover.src = song.cover;

      document.querySelectorAll('.track-item').forEach((item, i) => {
        if (i === currentIdx) item.classList.add('active');
        else item.classList.remove('active');
      });
    }

    function togglePlay() {
      if (audio.paused) {
        if (!audio.currentTime) {
          playSong(0);
        } else {
          audio.play();
          if(playBtn) playBtn.textContent = '❚❚';
          document.body.classList.add('playing');
        }
      } else {
        audio.pause();
        if(playBtn) playBtn.textContent = '▶';
        document.body.classList.remove('playing');
      }
    }

    function nextSong() {
      currentIdx = (currentIdx + 1) % playlist.length;
      playSong(currentIdx);
    }

    function prevSong() {
      currentIdx = (currentIdx - 1 + playlist.length) % playlist.length;
      playSong(currentIdx);
    }

    audio.addEventListener('timeupdate', () => {
      const pFilled = document.getElementById('progress-filled');
      const cTime = document.getElementById('current-time');
      const tDur = document.getElementById('total-duration');
      if (audio.duration && pFilled) {
        const percent = (audio.currentTime / audio.duration) * 100;
        pFilled.style.width = `${percent}%`;
        if(cTime) cTime.textContent = formatTime(audio.currentTime);
        if(tDur) tDur.textContent = formatTime(audio.duration);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      const tDur = document.getElementById('total-duration');
      if(tDur) tDur.textContent = formatTime(audio.duration);
    });

    function setProgress(e) {
      const pBar = document.getElementById('progress-bar');
      if(pBar && audio.duration) {
        const width = pBar.clientWidth;
        audio.currentTime = (e.offsetX / width) * audio.duration;
      }
    }

    function setVolume(val) {
      audio.volume = val;
    }

    audio.addEventListener('ended', () => {
      nextSong();
    });
  </script>

</body>
</html>
