<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allie's Book Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
    }

    body {
      background-color: #0a0a0d;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      overflow-x: hidden;
    }

    /* Contenedor Principal: Estilo Libro Abierto (2 Paneles) */
    .book-container {
      background: rgba(16, 16, 22, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      width: 100%;
      max-width: 960px;
      min-height: 520px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85), inset 0 0 2px rgba(255, 255, 255, 0.1);
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Lomo Central del Libro (Divisor) */
    .book-spine {
      width: 2px;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      position: absolute;
      top: 5%;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
    }

    /* Páginas del Libro (Izquierda y Derecha) */
    .book-page {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* PÁGINA IZQUIERDA: PERFIL ALLIE */
    .page-header {
      margin-bottom: 20px;
    }

    .book-chapter-tag {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 8px;
    }

    .main-name {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .info-card {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .info-item:last-child {
      border-bottom: none;
    }

    .info-key {
      color: #64748b;
      font-size: 13px;
    }

    .info-val {
      color: #e2e8f0;
      font-weight: 600;
    }

    .quote-section {
      background: rgba(255, 255, 255, 0.015);
      border-left: 3px solid rgba(255, 255, 255, 0.2);
      padding: 14px 18px;
      border-radius: 0 12px 12px 0;
      font-style: italic;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
    }

    /* PÁGINA DERECHA: REPRODUCTOR & PLAYLIST */
    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .now-playing-box {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .active-cover {
      width: 75px;
      height: 75px;
      border-radius: 14px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .active-meta {
      flex: 1;
    }

    .active-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .active-artist {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .play-btn-main {
      background: #ffffff;
      color: #000000;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      transition: transform 0.2s, background 0.2s;
    }

    .play-btn-main:hover {
      transform: scale(1.08);
      background: #e2e8f0;
    }

    /* Lista de Canciones */
    .playlist-title {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 12px;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .song-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .song-card.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .song-thumb-mini {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
    }

    .song-info-mini {
      flex: 1;
    }

    .song-name-mini {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }

    .song-artist-mini {
      font-size: 11px;
      color: #94a3b8;
    }

    /* Responsivo para celulares si lo abren en móvil */
    @media (max-width: 768px) {
      .book-container {
        flex-direction: column;
        max-width: 450px;
      }
      .book-spine {
        display: none;
      }
      .book-page {
        padding: 25px;
      }
    }
  </style>
</head>
<body>

  <div class="book-container">
    <div class="book-spine"></div>

    <!-- PÁGINA IZQUIERDA: ALLIE -->
    <div class="book-page">
      <div>
        <div class="page-header">
          <div class="book-chapter-tag">CHAPTER I — PROFILE</div>
          <div class="main-name">ALLIE</div>
        </div>

        <div class="info-card">
          <div class="info-item">
            <span class="info-key">Name</span>
            <span class="info-val">Allie</span>
          </div>
          <div class="info-item">
            <span class="info-key">País</span>
            <span class="info-val">Perú</span>
          </div>
          <div class="info-item">
            <span class="info-key">Username</span>
            <span class="info-val">Addictedtoyouu</span>
          </div>
        </div>
      </div>

      <div class="quote-section">
        "Echo de menos tú y yo aquí en mi cuarto, pero te lo..."
      </div>
    </div>

    <!-- PÁGINA DERECHA: REPRODUCTOR -->
    <div class="book-page">
      <div>
        <div class="player-header">
          <div class="book-chapter-tag">CHAPTER II — MUSIC</div>
        </div>

        <!-- Tarjeta de reproducción actual -->
        <div class="now-playing-box">
          <img id="active-cover" src="https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg" class="active-cover" alt="Cover">
          <div class="active-meta">
            <div class="active-title" id="active-title">SUPERESTRELLA</div>
            <div class="active-artist" id="active-artist">Aitana</div>
          </div>
          <button class="play-btn-main" id="play-btn" onclick="togglePlay()">▶</button>
        </div>

        <!-- Lista de lectura / Playlist -->
        <div class="playlist-title">PLAYLIST</div>
        <div class="song-list">
          <div class="song-card active" onclick="playSong(0)" id="song-card-0">
            <img src="https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg" class="song-thumb-mini" alt="Superestrella">
            <div class="song-info-mini">
              <div class="song-name-mini">SUPERESTRELLA</div>
              <div class="song-artist-mini">Aitana</div>
            </div>
          </div>

          <div class="song-card" onclick="playSong(1)" id="song-card-1">
            <img src="https://i.postimg.cc/50wYKF10/artworks-z-GXe-TIC6Z17nhvx-J-1v9QKQ-t500x500.jpg" class="song-thumb-mini" alt="Mon Amour">
            <div class="song-info-mini">
              <div class="song-name-mini">Mon Amour (Remix)</div>
              <div class="song-artist-mini">Zzoilo x Aitana</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player" src="Aitana - SUPERESTRELLA.mp3"></audio>

  <script>
    const playlist = [
      { 
        file: 'Aitana - SUPERESTRELLA.mp3', 
        title: 'SUPERESTRELLA', 
        artist: 'Aitana', 
        cover: 'https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg' 
      },
      { 
        file: 'zzoilo - Mon Amour (Remix).mp3', 
        title: 'Mon Amour (Remix)', 
        artist: 'Zzoilo x Aitana', 
        cover: 'https://i.postimg.cc/50wYKF10/artworks-z-GXe-TIC6Z17nhvx-J-1v9QKQ-t500x500.jpg' 
      }
    ];

    let currentIdx = 0;
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const activeTitle = document.getElementById('active-title');
    const activeArtist = document.getElementById('active-artist');
    const activeCover = document.getElementById('active-cover');

    function playSong(index) {
      currentIdx = index;
      const song = playlist[currentIdx];
      audio.src = song.file;
      audio.play();
      
      playBtn.textContent = '❚❚';
      activeTitle.textContent = song.title;
      activeArtist.textContent = song.artist;
      activeCover.src = song.cover;

      document.querySelectorAll('.song-card').forEach((card, i) => {
        if (i === currentIdx) card.classList.add('active');
        else card.classList.remove('active');
      });
    }

    function togglePlay() {
      if (audio.paused) {
        if (!audio.currentTime) {
          playSong(0);
        } else {
          audio.play();
          playBtn.textContent = '❚❚';
        }
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    }
  </script>

</body>
</html>
