<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allie's Cyber Book Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body {
      background-color: #030305;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      overflow-x: hidden;
      position: relative;
      transition: background 1.2s ease;
    }

    /* Fondo Rosa Neón Dinámico al reproducir */
    body.playing {
      background: linear-gradient(135deg, #140510, #22081c, #0a0208);
      background-size: 400% 400%;
      animation: pinkGradient 10s ease infinite;
    }

    @keyframes pinkGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Contenedor Principal: El Libro Futurista */
    .open-book {
      background: rgba(15, 15, 22, 0.92);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      width: 100%;
      max-width: 980px;
      min-height: 560px;
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.9);
      display: flex;
      position: relative;
      overflow: hidden;
      z-index: 2;
      perspective: 1200px;
      transition: all 1s ease;
    }

    /* Aura Neón alrededor del libro al sonar la música */
    body.playing .open-book {
      background: #231208 !important; /* Tono pasta café oscuro neón */
      border: 2px solid rgba(244, 114, 182, 0.7);
      box-shadow: 0 0 50px rgba(244, 114, 182, 0.4), 0 0 100px rgba(236, 72, 153, 0.25), 0 40px 80px rgba(0, 0, 0, 0.9);
      animation: auraPulse 3s ease-in-out infinite;
    }

    @keyframes auraPulse {
      0%, 100% {
        box-shadow: 0 0 40px rgba(244, 114, 182, 0.3), 0 0 80px rgba(236, 72, 153, 0.15), 0 40px 80px rgba(0, 0, 0, 0.9);
      }
      50% {
        box-shadow: 0 0 70px rgba(244, 114, 182, 0.65), 0 0 130px rgba(236, 72, 153, 0.35), 0 40px 80px rgba(0, 0, 0, 0.9);
      }
    }

    body.playing .book-page {
      background: #fdfbf7 !important;
      color: #1e120b !important;
    }

    /* Lomo Central Holo-Binding */
    .book-binding {
      width: 24px;
      background: linear-gradient(90deg, 
        rgba(0,0,0,0.7) 0%, 
        rgba(255,255,255,0.05) 50%, 
        rgba(0,0,0,0.7) 100%);
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
      transition: background 1s ease;
    }

    body.playing .book-binding {
      background: linear-gradient(90deg, #180b04 0%, #3a1d0d 50%, #180b04 100%);
    }

    /* Páginas del Libro con animación de transición al cambiar */
    .book-page {
      flex: 1;
      padding: 45px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: transparent;
      color: #f1f5f9;
      transition: background 1s ease, color 1s ease, transform 0.6s ease, opacity 0.6s ease;
    }

    .book-page.page-flip-effect {
      animation: pageTurn 0.7s ease-in-out;
    }

    @keyframes pageTurn {
      0% { transform: rotateY(0deg); opacity: 1; }
      50% { transform: rotateY(-20deg) scale(0.97); opacity: 0.5; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }

    .book-page:first-child {
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    body.playing .book-page:first-child {
      border-right: 1px solid #e7dfd1 !important;
    }

    /* Control de Navegación de Páginas (Arriba) */
    .page-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .chapter-tag {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 700;
    }

    body.playing .chapter-tag { color: #8c6d53; }

    .nav-arrow-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    body.playing .nav-arrow-btn {
      background: rgba(92, 58, 33, 0.08);
      border-color: rgba(92, 58, 33, 0.2);
      color: #3b2416;
    }

    .nav-arrow-btn:hover {
      background: rgba(244, 114, 182, 0.2);
      border-color: rgba(244, 114, 182, 0.5);
      transform: translateX(3px);
    }

    /* PÁGINA IZQUIERDA: PERFIL FUTURISTA */
    .page-title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      margin-bottom: 20px;
      position: relative;
    }

    body.playing .page-title { color: #2b180d; }

    .cyber-info-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .cyber-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      transition: all 0.4s ease;
    }

    body.playing .cyber-card {
      background: rgba(92, 58, 33, 0.04);
      border-color: rgba(92, 58, 33, 0.12);
    }

    .cyber-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      bottom: 20%;
      width: 3px;
      background: rgba(244, 114, 182, 0.5);
      border-radius: 2px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cyber-card:hover::before { opacity: 1; }

    .cyber-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #64748b;
    }

    body.playing .cyber-label { color: #7c5c40; }

    .cyber-value {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
    }

    body.playing .cyber-value { color: #3b2416; }

    .book-quote {
      background: rgba(255, 255, 255, 0.015);
      border-left: 3px solid rgba(244, 114, 182, 0.5);
      padding: 14px 18px;
      border-radius: 0 12px 12px 0;
      font-style: italic;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      transition: all 0.4s ease;
    }

    body.playing .book-quote {
      background: rgba(92, 58, 33, 0.05);
      border-left-color: #8c6d53;
      color: #5c4033;
    }

    /* PÁGINA DERECHA: REPRODUCTOR FUTURISTA */
    .futuristic-player {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
      transition: all 0.4s ease;
    }

    body.playing .futuristic-player {
      background: rgba(92, 58, 33, 0.05);
      border-color: rgba(92, 58, 33, 0.18);
    }

    .player-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 15px;
    }

    .song-cover-container {
      position: relative;
    }

    .song-cover {
      width: 65px;
      height: 65px;
      border-radius: 14px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Ecualizador animado en miniatura */
    .eq-bar-container {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 16px;
      margin-top: 4px;
    }

    .eq-bar {
      width: 3px;
      background: #f472b6;
      border-radius: 2px;
      height: 4px;
    }

    body.playing .eq-bar:nth-child(1) { animation: eqAnim 0.8s ease-in-out infinite alternate; }
    body.playing .eq-bar:nth-child(2) { animation: eqAnim 1.1s ease-in-out infinite alternate 0.2s; }
    body.playing .eq-bar:nth-child(3) { animation: eqAnim 0.7s ease-in-out infinite alternate 0.4s; }
    body.playing .eq-bar:nth-child(4) { animation: eqAnim 0.9s ease-in-out infinite alternate 0.1s; }

    @keyframes eqAnim {
      0% { height: 3px; }
      100% { height: 16px; }
    }

    .song-title-main {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 2px;
    }

    body.playing .song-title-main { color: #2b180d; }

    .song-artist-main {
      font-size: 12px;
      color: #94a3b8;
    }

    body.playing .song-artist-main { color: #7c5c40; }

    /* Controles táctiles futuristas */
    .player-controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 14px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s ease;
    }

    body.playing .ctrl-btn { color: #7c5c40; }

    .ctrl-btn:hover {
      color: #f472b6;
      transform: scale(1.15);
    }

    .main-play-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    body.playing .main-play-btn {
      background: #5c3a21;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(92, 58, 33, 0.4);
    }

    .main-play-btn:hover {
      transform: scale(1.08);
      background: #f472b6;
      color: #ffffff;
    }

    /* Barra de Progreso Neón */
    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      color: #64748b;
      margin-bottom: 12px;
    }

    body.playing .progress-container { color: #7c5c40; }

    .progress-bar {
      flex: 1;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    body.playing .progress-bar { background: rgba(92, 58, 33, 0.15); }

    .progress-filled {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ec4899, #f472b6);
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(244, 114, 182, 0.8);
    }

    body.playing .progress-filled {
      background: #5c3a21;
      box-shadow: none;
    }

    /* Control de Volumen */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #64748b;
    }

    body.playing .volume-container { color: #7c5c40; }

    .volume-slider {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      accent-color: #f472b6;
      cursor: pointer;
    }

    body.playing .volume-slider { accent-color: #5c3a21; }

    /* Playlist con diseño Neón / Futurista */
    .tracks-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    body.playing .track-item {
      background: rgba(92, 58, 33, 0.03);
      border-color: rgba(92, 58, 33, 0.08);
    }

    .track-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(244, 114, 182, 0.4);
      transform: translateX(4px);
    }

    body.playing .track-item:hover {
      background: rgba(92, 58, 33, 0.08);
      border-color: rgba(92, 58, 33, 0.25);
    }

    .track-item.active {
      background: rgba(244, 114, 182, 0.1);
      border-color: rgba(244, 114, 182, 0.5);
    }

    body.playing .track-item.active {
      background: rgba(92, 58, 33, 0.15);
      border-color: rgba(92, 58, 33, 0.35);
    }

    .track-thumb {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
    }

    .track-info { flex: 1; }

    .track-name {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }

    body.playing .track-name { color: #2b180d; }

    .track-artist {
      font-size: 11px;
      color: #94a3b8;
    }

    body.playing .track-artist { color: #7c5c40; }

    /* Adaptabilidad móvil */
    @media (max-width: 768px) {
      .open-book {
        flex-direction: column;
        max-width: 450px;
      }
      .book-binding { display: none; }
      .book-page { padding: 25px; }
      .book-page:first-child {
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
    }
  </style>
</head>
<body>

  <div class="open-book">
    <div class="book-binding"></div>

    <!-- PÁGINA IZQUIERDA -->
    <div class="book-page" id="left-page">
      <div>
        <div class="page-nav-bar">
          <div class="chapter-tag" id="left-chapter-tag">CAPÍTULO I — IDENTIDAD</div>
        </div>

        <div id="left-content">
          <div class="page-title">ALLIE</div>

          <div class="cyber-info-grid">
            <div class="cyber-card">
              <span class="cyber-label">Name</span>
              <span class="cyber-value">Allie</span>
            </div>
            <div class="cyber-card">
              <span class="cyber-label">País</span>
              <span class="cyber-value">Perú</span>
            </div>
            <div class="cyber-card">
              <span class="cyber-label">Username</span>
              <span class="cyber-value">Addictedtoyouu</span>
            </div>
          </div>
        </div>
      </div>

      <div class="book-quote" id="left-quote">
        "Echo de menos tú y yo aquí en mi cuarto, pero te lo..."
      </div>
    </div>

    <!-- PÁGINA DERECHA -->
    <div class="book-page" id="right-page">
      <div>
        <div class="page-nav-bar">
          <div class="chapter-tag">CAPÍTULO II — SONIDOS</div>
          <button class="nav-arrow-btn" onclick="flipPageNext()">Siguiente Página ➔</button>
        </div>

        <!-- REPRODUCTOR FUTURISTA -->
        <div class="futuristic-player">
          <div class="player-top">
            <div class="song-cover-container">
              <img id="active-cover" src="https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg" class="song-cover" alt="Cover">
            </div>
            <div style="flex: 1;">
              <div class="song-title-main" id="active-title">SUPERESTRELLA</div>
              <div class="song-artist-main" id="active-artist">Aitana</div>
              
              <!-- Ecualizador dinámico -->
              <div class="eq-bar-container">
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
              </div>
            </div>
          </div>

          <!-- Controles -->
          <div class="player-controls-row">
            <button class="ctrl-btn" onclick="prevSong()" title="Anterior">⏮</button>
            <button class="main-play-btn" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn" onclick="nextSong()" title="Siguiente">⏭</button>
          </div>

          <!-- Barra de Progreso Neón -->
          <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="progress-bar" id="progress-bar" onclick="setProgress(event)">
              <div class="progress-filled" id="progress-filled"></div>
            </div>
            <span id="total-duration">0:00</span>
          </div>

          <!-- Control de Volumen -->
          <div class="volume-container">
            <span>🔊</span>
            <input type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" id="volume-slider" oninput="setVolume(this.value)">
          </div>
        </div>

        <!-- PLAYLIST -->
        <div class="chapter-tag" style="margin-bottom: 10px;">PLAYLIST / CANCIONES</div>
        <div class="tracks-list">
          <div class="track-item active" onclick="playSong(0)" id="track-0">
            <img src="https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg" class="track-thumb" alt="Superestrella">
            <div class="track-info">
              <div class="track-name">SUPERESTRELLA</div>
              <div class="track-artist">Aitana</div>
            </div>
          </div>

          <div class="track-item" onclick="playSong(1)" id="track-1">
            <img src="https://i.postimg.cc/50wYKF10/artworks-z-GXe-TIC6Z17nhvx-J-1v9QKQ-t500x500.jpg" class="track-thumb" alt="Mon Amour">
            <div class="track-info">
              <div class="track-name">Mon Amour (Remix)</div>
              <div class="track-artist">Zzoilo x Aitana</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player" src="Aitana - SUPERESTRELLA.mp3"></audio>

  <script>
    const playlist = [
      { 
        file: 'Aitana - SUPERESTRELLA.mp3', 
        title: 'SUPERESTRELLA', 
        artist: 'Aitana', 
        cover: 'https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg' 
      },
      { 
        file: 'zzoilo - Mon Amour (Remix).mp3', 
        title: 'Mon Amour (Remix)', 
        artist: 'Zzoilo x Aitana', 
        cover: 'https://i.postimg.cc/50wYKF10/artworks-z-GXe-TIC6Z17nhvx-J-1v9QKQ-t500x500.jpg' 
      }
    ];

    let currentIdx = 0;
    let pageState = 1;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const activeTitle = document.getElementById('active-title');
    const activeArtist = document.getElementById('active-artist');
    const activeCover = document.getElementById('active-cover');
    const progressFilled = document.getElementById('progress-filled');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');

    const leftPage = document.getElementById('left-page');
    const rightPage = document.getElementById('right-page');
    const leftChapterTag = document.getElementById('left-chapter-tag');
    const leftContent = document.getElementById('left-content');
    const leftQuote = document.getElementById('left-quote');

    // Función para pasar página con animación 3D
    function flipPageNext() {
      leftPage.classList.add('page-flip-effect');
      rightPage.classList.add('page-flip-effect');

      setTimeout(() => {
        if (pageState === 1) {
          pageState = 2;
          leftChapterTag.textContent = 'CAPÍTULO III — GALERÍA & REDES';
          leftContent.innerHTML = `
            <div class="page-title" style="font-size: 28px;">ENLACES</div>
            <div class="cyber-info-grid">
              <div class="cyber-card" style="cursor: pointer;" onclick="alert('Abriendo Galería...')">
                <span class="cyber-label">Galería</span>
                <span class="cyber-value">📷 Fotos</span>
              </div>
              <div class="cyber-card" style="cursor: pointer;" onclick="alert('Abriendo Amigos...')">
                <span class="cyber-label">Comunidad</span>
                <span class="cyber-value">💬 Amigos</span>
              </div>
            </div>
          `;
          leftQuote.textContent = '"Un rincón especial renovado para compartir recuerdos."';
        } else {
          pageState = 1;
          leftChapterTag.textContent = 'CAPÍTULO I — IDENTIDAD';
          leftContent.innerHTML = `
            <div class="page-title">ALLIE</div>
            <div class="cyber-info-grid">
              <div class="cyber-card">
                <span class="cyber-label">Name</span>
                <span class="cyber-value">Allie</span>
              </div>
              <div class="cyber-card">
                <span class="cyber-label">País</span>
                <span class="cyber-value">Perú</span>
              </div>
              <div class="cyber-card">
                <span class="cyber-label">Username</span>
                <span class="cyber-value">Addictedtoyouu</span>
              </div>
            </div>
          `;
          leftQuote.textContent = '"Echo de menos tú y yo aquí en mi cuarto, pero te lo..."';
        }
      }, 300);

      setTimeout(() => {
        leftPage.classList.remove('page-flip-effect');
        rightPage.classList.remove('page-flip-effect');
      }, 700);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function playSong(index) {
      currentIdx = index;
      const song = playlist[currentIdx];
      audio.src = song.file;
      audio.play();
      
      playBtn.textContent = '❚❚';
      document.body.classList.add('playing');
      activeTitle.textContent = song.title;
      activeArtist.textContent = song.artist;
      activeCover.src = song.cover;

      document.querySelectorAll('.track-item').forEach((item, i) => {
        if (i === currentIdx) item.classList.add('active');
        else item.classList.remove('active');
      });
    }

    function togglePlay() {
      if (audio.paused) {
        if (!audio.currentTime) {
          playSong(0);
        } else {
          audio.play();
          playBtn.textContent = '❚❚';
          document.body.classList.add('playing');
        }
      } else {
        audio.pause();
        playBtn.textContent = '▶';
        document.body.classList.remove('playing');
      }
    }

    function nextSong() {
      currentIdx = (currentIdx + 1) % playlist.length;
      playSong(currentIdx);
    }

    function prevSong() {
      currentIdx = (currentIdx - 1 + playlist.length) % playlist.length;
      playSong(currentIdx);
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFilled.style.width = `${percent}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        totalDurationEl.textContent = formatTime(audio.duration);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    progressBar.addEventListener('click', (e) => {
      const width = progressBar.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;
      if (duration) {
        audio.currentTime = (clickX / width) * duration;
      }
    });

    function setVolume(val) {
      audio.volume = val;
    }

    audio.addEventListener('ended', () => {
      nextSong();
    });
  </script>

</body>
</html>
