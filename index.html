<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aitana Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #070709;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Contenedor de la Tarjeta Central Flotante */
    .central-card {
      background: rgba(14, 14, 18, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* Pestañas de Navegación */
    .tabs-header {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 15px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    /* Secciones de Contenido */
    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Estilo de la Pestaña Perfil */
    .profile-info {
      text-align: center;
    }

    .profile-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .profile-subtitle {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      margin-bottom: 15px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: #64748b;
    }

    .info-val {
      color: #e2e8f0;
      font-weight: 500;
    }

    .quote {
      font-size: 12px;
      font-style: italic;
      color: #94a3b8;
      padding: 0 10px;
      line-height: 1.5;
    }

    /* Estilo de la Pestaña Playlist y Reproductor con Portada */
    .playlist-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .song-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px 14px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s, border-color 0.2s;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .song-item.active {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.06);
    }

    .song-thumb {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
    }

    .song-details {
      flex: 1;
    }

    .song-name {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }

    .song-artist {
      font-size: 11px;
      color: #94a3b8;
    }

    /* Mini Reproductor Integrado con carátula activa */
    .mini-player {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-cover-active {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      background: #111;
    }

    .play-trigger {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: background 0.2s;
    }

    .play-trigger:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .current-playing-text {
      font-size: 12px;
      color: #94a3b8;
      text-align: left;
      flex: 1;
    }

    .current-playing-text b {
      display: block;
      color: #ffffff;
      font-size: 13px;
    }

    /* Pestaña Redes */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px 18px;
      border-radius: 14px;
      color: #e2e8f0;
      font-size: 13px;
      text-decoration: none;
      display: flex;
      justify-content: space-between;
      transition: background 0.2s;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>

  <div class="central-card">
    <!-- Pestañas de Navegación -->
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab(event, 'profile-tab')">Perfil</button>
      <button class="tab-btn" onclick="switchTab(event, 'playlist-tab')">Playlist</button>
      <button class="tab-btn" onclick="switchTab(event, 'links-tab')">Redes</button>
    </div>

    <!-- Contenido 1: Perfil -->
    <div id="profile-tab" class="tab-content active">
      <div class="profile-info">
        <div class="profile-title">AITANA</div>
        <div class="profile-subtitle">Cataluña</div>

        <div class="info-box">
          <div class="info-row">
            <span class="info-label">Name</span>
            <span class="info-val">Allie</span>
          </div>
          <div class="info-row">
            <span class="info-label">País</span>
            <span class="info-val">Perú</span>
          </div>
          <div class="info-row">
            <span class="info-label">Username</span>
            <span class="info-val">Addictedtoyouu</span>
          </div>
        </div>

        <div class="quote">
          "Echo de menos tú y yo aquí en mi cuarto, pero te lo..."
        </div>
      </div>
    </div>

    <!-- Contenido 2: Playlist -->
    <div id="playlist-tab" class="tab-content">
      <div class="playlist-container">
        <div class="song-item" onclick="playSong(0)" id="song-0">
          <img src="https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg" class="song-thumb" alt="Superestrella">
          <div class="song-details">
            <div class="song-name">SUPERESTRELLA</div>
            <div class="song-artist">Aitana</div>
          </div>
        </div>

        <div class="song-item" onclick="playSong(1)" id="song-1">
          <img src="https://i.postimg.cc/50wYKF10/artworks-z-GXe-TIC6Z17nhvx-J-1v9QKQ-t500x500.jpg" class="song-thumb" alt="Mon Amour">
          <div class="song-details">
            <div class="song-name">Mon Amour (Remix)</div>
            <div class="song-artist">Zzoilo x Aitana</div>
          </div>
        </div>
      </div>

      <div class="mini-player">
        <img id="active-cover" src="https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg" class="player-cover-active" alt="Cover">
        <button class="play-trigger" id="main-play-btn" onclick="togglePlay()">▶</button>
        <div class="current-playing-text" id="player-status">
          <b>SUPERESTRELLA</b>Aitana
        </div>
      </div>
    </div>

    <!-- Contenido 3: Redes -->
    <div id="links-tab" class="tab-content">
      <div class="links-list">
        <a href="#" class="social-btn"><span>Gallery</span> <span>→</span></a>
        <a href="#" class="social-btn"><span>Friends</span> <span>→</span></a>
        <a href="#" class="social-btn"><span>Instagram</span> <span>→</span></a>
      </div>
    </div>
  </div>

  <audio id="audio-element" src="Aitana - SUPERESTRELLA.mp3"></audio>

  <script>
    const playlist = [
      { 
        file: 'Aitana - SUPERESTRELLA.mp3', 
        title: 'SUPERESTRELLA', 
        artist: 'Aitana', 
        cover: 'https://i.postimg.cc/g0x3sJnZ/250x250-000000-80-0-0.jpg' 
      },
      { 
        file: 'zzoilo - Mon Amour (Remix).mp3', 
        title: 'Mon Amour (Remix)', 
        artist: 'Zzoilo x Aitana', 
        cover: 'https://i.postimg.cc/50wYKF10/artworks-z-GXe-TIC6Z17nhvx-J-1v9QKQ-t500x500.jpg' 
      }
    ];

    let currentIdx = 0;
    const audioElement = document.getElementById('audio-element');
    const playBtn = document.getElementById('main-play-btn');
    const playerStatus = document.getElementById('player-status');
    const activeCover = document.getElementById('active-cover');

    function switchTab(evt, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }

    function playSong(index) {
      currentIdx = index;
      const song = playlist[currentIdx];
      audioElement.src = song.file;
      audioElement.play();
      playBtn.textContent = '❚❚';
      activeCover.src = song.cover;
      playerStatus.innerHTML = `<b>${song.title}</b>${song.artist}`;
      
      document.querySelectorAll('.song-item').forEach((item, i) => {
        if(i === currentIdx) item.classList.add('active');
        else item.classList.remove('active');
      });
    }

    function togglePlay() {
      if(audioElement.paused) {
        if(!audioElement.currentTime) {
          playSong(0);
        } else {
          audioElement.play();
          playBtn.textContent = '❚❚';
        }
      } else {
        audioElement.pause();
        playBtn.textContent = '▶';
      }
    }
  </script>

</body>
</html>
